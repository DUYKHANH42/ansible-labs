---
- name: Cai dat cac package can thiet
  dnf:
    name:
      - docker
      - python3-pip
      - git
    state: present

- name: Khoi dong Docker service
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Them ec2-user vao group docker
  user:
    name: ec2-user
    groups: docker
    append: yes

- name: Cai Docker Compose plugin
  shell: |
    mkdir -p /usr/local/lib/docker/cli-plugins
    curl -SL "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64" \
      -o /usr/local/lib/docker/cli-plugins/docker-compose
    chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
  args:
    creates: /usr/local/lib/docker/cli-plugins/docker-compose

- name: Kiem tra Docker version
  command: docker --version
  register: docker_version
  changed_when: false

- name: Hien thi Docker version
  debug:
    msg: "{{ docker_version.stdout }}"
